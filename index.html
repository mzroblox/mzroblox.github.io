<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090512">
<meta name="description" content="Zain — Roblox developer.">
<title>Zain — Roblox Developer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090512'/%3E%3Ctext x='32' y='45' font-size='42' font-weight='bold' text-anchor='middle' fill='%23c084fc'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090512;--line:rgba(192,132,252,.22);--muted:#a39ab7;--text:#f7f1ff;--purple:#c084fc;--violet:#8b5cf6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% -15%,rgba(124,58,237,.3),transparent 55%),radial-gradient(ellipse at 85% 55%,rgba(88,28,135,.16),transparent 45%);transform:translate3d(calc(var(--mx,0)*-10px),calc(var(--my,0)*-10px),0)}
a{color:inherit;text-decoration:none}
.wrap{width:min(980px,calc(100% - 36px));margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:25px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.04em}
.mark{width:36px;height:36px;border:1px solid #a855f777;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#3b1763,#160c29);font-size:20px;color:#f3d9ff;box-shadow:0 0 22px #9333ea30}
.topright{font:10px 'DM Mono',monospace;color:#c4b5d9;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:9px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#c084fc;box-shadow:0 0 12px #c084fc}
.hero{padding:92px 0 30px}
.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.17em;color:#c4a5fd;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";width:22px;height:1px;background:#c084fc}
h1{font-size:clamp(43px,8vw,80px);letter-spacing:-.078em;line-height:1.02;margin:23px 0 17px;font-weight:800}
.gradient{background:linear-gradient(105deg,#fff,#e9d5ff 24%,#c084fc 52%,#8b5cf6 73%,#f0abfc 95%);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 7s linear infinite;filter:drop-shadow(0 0 24px #a855f744)}
@keyframes shine{to{background-position:220% center}}
.intro{color:#b7abc9;max-width:590px;font-size:14px;line-height:1.85}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px}
.btn{border:1px solid #c084fc55;border-radius:10px;padding:11px 15px;font-size:12px;font-weight:700;display:inline-flex;gap:8px;align-items:center;background:#1b102dcc;transition:transform .2s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:#c084fc;transform:translateY(-2px);box-shadow:0 7px 28px #9333ea30}
.btn.primary{background:linear-gradient(110deg,#c084fc,#8b5cf6);color:#160925;border-color:transparent;box-shadow:0 0 28px #9333ea35}
.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:13px;margin:35px 0 80px}
.stat{border:1px solid var(--line);border-radius:15px;padding:22px;background:linear-gradient(145deg,#231439d9,#0f091bd9);min-height:126px;box-shadow:0 14px 45px #0002;backdrop-filter:blur(10px);transition:transform .2s,border-color .2s}
.stat:hover{transform:translateY(-3px);border-color:#a855f777}
.statlabel{font:10px 'DM Mono',monospace;color:#b6a8ca;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.big{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.06em;margin:16px 0 4px}
.purple{background:linear-gradient(100deg,#f3e8ff,#c084fc 55%,#a78bfa);background-clip:text;-webkit-background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--muted)}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c084fc;box-shadow:0 0 9px #c084fc;margin-right:6px}
.footer{border-top:1px solid var(--line);padding:24px 0 34px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#9184a7;font:10px 'DM Mono',monospace;letter-spacing:.04em}
.footer a:hover{color:#e9d5ff}
@media(max-width:650px){.hero{padding-top:65px}.stats{grid-template-columns:1fr 1fr;margin-bottom:55px}.stat:first-child{grid-column:1/-1}.top{padding:19px 0}.topright{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="wrap">
<header class="top">
<a class="brand" href="#" aria-label="Zain home"><span class="mark">✦</span><span>zain<span style="color:#a78bfa">/dev</span></span></a>
<div class="topright"><span class="dot"></span>Roblox developer</div>
</header>
<main>
<section class="hero">
<div class="eyebrow">Independent game developer</div>
<h1>Hello, I'm <span class="gradient">Zain.</span></h1>
<p class="intro">Building and scaling Roblox games.</p>
<div class="links">
<a class="btn primary" id="robloxLink" href="https://www.roblox.com/users/5844444498/profile" target="_blank" rel="noreferrer">↗ Roblox profile</a>
</div>
</section>
<section class="stats" aria-label="Roblox statistics">
<div class="stat">
<div class="statlabel"><span>Total concurrent players</span><span>✦ LIVE</span></div>
<div class="big purple" id="totalCcu">—</div>
<div class="sub" id="updated"><span class="pulse"></span>Loading stats…</div>
</div>
<div class="stat">
<div class="statlabel">Experiences tracked</div>
<div class="big purple" id="gameCount">—</div>
<div class="sub">Across your portfolio</div>
</div>
<div class="stat">
<div class="statlabel">Groups</div>
<div class="big purple" id="groupCount">15</div>
<div class="sub">Roblox communities</div>
</div>
</section>
</main>
<footer class="footer">
<span>© <span id="year"></span> ZAIN</span>
<span>DATA FROM ROBLOX · <a href="#" id="backToTop">BACK TO TOP ↑</a></span>
</footer>
</div>
<script src="./config.js"></script>
<script>
const byId=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString("en-US");
byId("year").textContent=new Date().getFullYear();

const cfg=window.PORTFOLIO_CONFIG||{};
byId("robloxLink").href=cfg.robloxProfileUrl||"https://www.roblox.com/users/5844444498/profile";
const api=(cfg.workerUrl||"").replace(/\/+$/,"");
const cacheKey="zain_portfolio_stats_v1";

function showStats(data,cached=false){
 if(!data||!Array.isArray(data.games))return;
 byId("totalCcu").textContent=fmt(data.totalCcu);
 byId("gameCount").textContent=fmt(data.games.length);
 byId("groupCount").textContent=fmt(data.groupCount||15);
 byId("updated").innerHTML='<span class="pulse"></span>'+(cached?"Last known stats":"Updated ")+new Date(data.updatedAt||Date.now()).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
}
try{
 const saved=localStorage.getItem(cacheKey);
 if(saved)showStats(JSON.parse(saved),true);
}catch(e){}

async function refreshStats(){
 if(!api){if(byId("totalCcu").textContent==="—")byId("updated").textContent="Stats temporarily unavailable";return}
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),8000);
 try{
  const res=await fetch(api+"/api/stats",{cache:"no-store",signal:controller.signal});
  if(!res.ok)throw new Error("Stats unavailable");
  const data=await res.json();
  if(!Array.isArray(data.games))throw new Error("Unexpected stats");
  showStats(data,false);
  try{localStorage.setItem(cacheKey,JSON.stringify(data))}catch(e){}
 }catch(e){
  if(byId("totalCcu").textContent==="—")byId("updated").textContent="Stats are temporarily unavailable";
 }finally{clearTimeout(timer)}
}
byId("backToTop").addEventListener("click",e=>{e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})});
refreshStats();
setInterval(refreshStats,60000);

/* Purple starfield that gently responds to the cursor */
(()=>{
 const canvas=byId("space"),ctx=canvas.getContext("2d");
 let w=0,h=0,dpr=1,stars=[],mx=.5,my=.5;
 const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  w=innerWidth;h=innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+"px";canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.min(180,Math.floor(w*h/6500))},()=>({
   x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.35+.25,
   a:Math.random()*.65+.2,p:Math.random()*Math.PI*2,s:Math.random()*.6+.2
  }));
 }
 function draw(t){
  ctx.clearRect(0,0,w,h);
  for(const s of stars){
   const x=s.x+(mx-.5)*24*s.s;
   const y=s.y+(my-.5)*24*s.s;
   const twinkle=reduced?1:(.72+Math.sin(t*.001+s.p)*.28);
   ctx.beginPath();
   ctx.fillStyle=`rgba(200,165,255,${s.a*twinkle})`;
   ctx.arc(x,y,s.r,0,Math.PI*2);
   ctx.fill();
  }
  if(!reduced)requestAnimationFrame(draw);
 }
 window.addEventListener("resize",resize,{passive:true});
 window.addEventListener("pointermove",e=>{
  mx=e.clientX/Math.max(1,w);my=e.clientY/Math.max(1,h);
  document.documentElement.style.setProperty("--mx",mx-.5);
  document.documentElement.style.setProperty("--my",my-.5);
 },{passive:true});
 resize();
 requestAnimationFrame(draw);
})();
</script>
</body>
</html>
